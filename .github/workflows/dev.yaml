name: Development CI/CD

on:
  push:
    branches:
      - main
      - dev

jobs:
  dev:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version: 1.21

      - name: Install dependencies
        run: go mod tidy

      - name: Lint
        run: go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest && golangci-lint run

      - name: Run unit tests
        run: go test ./... -v

      - name: Build binary
        run: go build -o app ./...

      - name: Deploy to Development (local container)
        run: |
          docker build -t go-crud-dev .
          docker run -d -p 8080:8080 --name go-crud-dev go-crud-dev
