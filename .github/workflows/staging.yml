name: Staging Pipeline

on:
  push:
    branches:
      - staging

jobs:
  staging:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Setup Docker Buildx
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 3️⃣ Build Docker image
      - name: Build Docker image
        run: docker build -t go-crud-app:staging .

      # 4️⃣ Start Postgres container
      - name: Start Postgres
        run: docker compose -f docker-compose.staging.yml up -d postgres-staging

      # 5️⃣ Wait for Postgres to be ready
      - name: Wait for Postgres
        run: |
          until docker exec pg-staging pg_isready -U postgres; do
            echo "Waiting for Postgres..."
            sleep 2
          done

      # 6️⃣ Reset database
      - name: Reset database
        run: |
          docker exec pg-staging psql -U postgres -c "SELECT pg_terminate_backend(pid) FROM pg_stat_activity WHERE datname='go_crud_staging';"
          docker exec pg-staging psql -U postgres -c "DROP DATABASE IF EXISTS go_crud_staging;"
          docker exec pg-staging psql -U postgres -c "CREATE DATABASE go_crud_staging;"

      # 7️⃣ Run migrations
      - name: Run migrations
        run: docker compose -f docker-compose.staging.yml run --rm app ./go-crud-app migrate

      # 8️⃣ Start application
      - name: Start application
        run: docker compose -f docker-compose.staging.yml up -d app

      # 9️⃣ Wait for app
      - name: Wait for app startup
        run: sleep 5

      # 🔟 Healthcheck
      - name: Healthcheck
        run: curl -f http://localhost:8080/health

      # 1️⃣1️⃣ Stop containers
      - name: Stop containers
        if: always()
        run: docker compose -f docker-compose.staging.yml down

      # 1️⃣2️⃣ Slack notification
      - name: Notify Slack
        if: always()
        run: |
          curl -X POST -H 'Content-type: application/json' \
          --data "{\"text\":\"Staging pipeline ${{ job.status }}\"}" \
          ${{ secrets.SLACK_WEBHOOK_URL }}