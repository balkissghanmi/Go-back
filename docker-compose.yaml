version: "3.9"

services:
  postgres-master:
    image: postgres:16
    container_name: postgres-master
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: go_crud
   
    volumes:
      - pgdata:/var/lib/postgresql/data

  app:
    build: .
    container_name: go-crud-app
    depends_on:
      - postgres-master
    environment:
      DB_HOST: postgres-master
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: go_crud
      DB_PORT: 5432
    ports:
      - "8080:8080"

volumes:
  pgdata:
