version: "3.9"

services:
  postgres-staging:
    image: postgres:16
    container_name: pg-staging
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: go_crud_staging
    ports:
      - "5434:5432"

  app:
    build: .
    container_name: go-crud-staging
    depends_on:
      - postgres-staging
    environment:
      DB_HOST: postgres-staging
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: go_crud_staging
      DB_PORT: 5432
    ports:
      - "8081:8080"